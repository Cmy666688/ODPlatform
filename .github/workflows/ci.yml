name: ODPlatform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: apps/platform/pyproject.toml
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - name: Install CPU PyTorch for checks
        run: python -m pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and check tools
        run: python -m pip install -e "./apps/platform[dev,desktop,mixercseg]"
      - name: Check source and run isolated tests
        run: python scripts/check_project.py
      - name: Build installable package
        run: python -m build apps/platform
