# apps/platform/pyproject.toml
# =============================================================================
# ODPlatform - platform 端配置 (hatchling backend)
# =============================================================================

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"


[project]
name = "od-platform"
dynamic = ["version"]                              # 版本号从 _version.py 动态读
description = "ODPlatform - 目标检测开发平台核心引擎"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ODPlatform Team" },
]
keywords = ["object-detection", "yolo", "deep-learning", "ml-platform"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "colorlog>=6.7.0",
    "psutil>=5.9.0",
    "torch>=2.0.0",
    "ultralytics>=8.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.5,<3",                                # ★ D5: 钉 Pydantic v2 语义(v1 API 不兼容), D1 底座的 >=2.0 收紧为此
    "Pillow>=10,<13",
    "imageio-ffmpeg>=0.6,<1",                         # 视频输出为浏览器可播放的 H.264
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff==0.17.1",                                  # 本地与 CI 使用同一套规则
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    "types-PyYAML",
    "types-psutil",
    "build>=1.0,<2",
]

desktop = [
    "PySide6>=6.6,<7",                               # 可选桌面示例,核心引擎不依赖 Qt
]

mixercseg = [
    "torch>=2.6",
    "timm>=1.0,<2",
    "einops>=0.7,<1",
    "fvcore>=0.1.5",
    "mmengine>=0.10,<1",
    "gdown>=5,<6",
]

cpu = [
    "numba>=0.63,<1",                               # 可选 CPU 扫描加速,不改变模型配方
]


# =============================================================================
# Entry-point Scripts (PEP 621 标准字段, 与 backend 无关)
# =============================================================================
[project.scripts]
odp-init = "od_platform.cli.init_project:initialize_project"
odp-reset = "od_platform.cli.reset_project:main"
odp-transform = "od_platform.cli.transform_data:main"
odp-validate = "od_platform.cli.validate_data:main"
odp-gen-config = "od_platform.runtime_config.generator:main"   # ★ D5(步骤 5 落地)
odp-train       = "od_platform.cli.train_model:main"                  # D6
odp-infer       = "od_platform.cli.infer:main"                       # D7
odp-prepare-cracks = "od_platform.cli.prepare_cracks:main"
odp-retention = "od_platform.common.retention:main"


# =============================================================================
# Pytest 配置 (D5 统一加入, D3/D4 的测试也一并受益)
# =============================================================================
[tool.pytest.ini_options]
testpaths        = ["tests"]
python_files     = ["test_*.py"]
python_classes   = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",      # 拼错的 mark 立刻报错,不再静默不跑
    "--tb=short",
]
filterwarnings = [
    # 业务代码用 warnings.warn 发的提示,测试里要能捕获
    "default::UserWarning",
]


# =============================================================================
# Hatchling 配置 (告诉它两件事: 包源码在哪、版本号从哪读)
# =============================================================================

# 告诉 hatchling 包源码在 src/od_platform/
[tool.hatch.build.targets.wheel]
packages = ["src/od_platform"]

# 动态版本号: 从 src/od_platform/_version.py 的 __version__ 读
[tool.hatch.version]
path = "src/od_platform/_version.py"
