# pyproject.toml(仓库根)
# =============================================================================
# ODPlatform Monorepo —— 仓库根配置
#
# 这份 pyproject 不描述任何"包",所以它【既没有 [build-system]、也没有 [project]】:
# 它唯一的职责是放【全仓共享的工具配置】。ruff / mypy / pytest 从仓库根运行时,
# 会自动读到这里的 [tool.*],于是 apps/ 下所有端、加上顶层 tests/,用的都是同一套
# 代码风格 / 类型检查 / 测试规则——配置只此一份,不必每个端各抄一遍。
#
# (一份只含 [tool.*] 的 pyproject 完全合法:这些工具只读自己那一段,不需要 [project]。)
# =============================================================================


# =============================================================================
# Ruff 配置(代码风格 + isort)
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"
# 固定版本的第三方模型保留上游排版,平台适配层照常检查。
extend-exclude = ["apps/platform/src/od_platform/backends/mixercseg/_vendor"]
src = [
    "apps/platform/src",
]

[tool.ruff.lint]
# 沿用讲义的 typing.Dict / Optional、分段导入与同行短句,不做全仓格式迁移。
# I / UP 属于风格迁移规则;保留语法、未定义名称、易错写法等检查。
select = ["E", "W", "F", "B", "C4"]
ignore = ["E501", "E701", "E702"]

# scripts/ 下的开发期入口必须先改 sys.path 再导入 src,
# E402(导入不在文件顶部)是该模式的必然产物,豁免之
[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"apps/desktop/main.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["od_platform"]


# =============================================================================
# Mypy 配置(类型检查)
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
explicit_package_bases = true
mypy_path = ["apps/platform/src", "apps/web-backend/src"]
exclude = ["backends/mixercseg/_vendor/"]

[[tool.mypy.overrides]]
module = ["colorlog.*", "psutil.*", "ultralytics.*", "torch.*", "paramiko.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["od_platform.backends.mixercseg._vendor.*", "timm.*", "fvcore.*", "mmengine.*", "gdown.*", "numba.*", "streamlit.*", "pandas.*", "matplotlib.*", "pynvml.*", "django.*"]
follow_imports = "skip"
ignore_missing_imports = true


# =============================================================================
# Pytest 配置(测试发现 + 标记)
# =============================================================================
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "od_web.settings"
minversion = "7.0"
testpaths = [
    "apps/platform/tests",
    "tests",
]
python_files = ["test_*.py"]
addopts = ["-v", "--strict-markers", "--tb=short"]

markers = [
    "unit: 单元测试 (快,无 IO)",
    "integration: 集成测试 (有 IO)",
    "slow: 慢测试 (> 1s)",
]
